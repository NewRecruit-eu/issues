name: Issue mover

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  move_issue:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    env:
      # PAT with Issues: read/write on the TARGET repo (classic: repo scope)
      TARGET_PAT: ${{ secrets.TARGET_PAT }}
      # Optional default target repo in owner/repo format. Example: BSData/horus-heresy-2nd-edition
      DEFAULT_TARGET_REPO: ""
    steps:
      - name: Move issue when comment is /move-to-data
        uses: actions/github-script@v7
        with:
          script: |
            const cmd = context.payload.comment.body.trim();
            if (!cmd.startsWith('/move-to-data')) {
              core.info('No /move-to-data command found — exiting.');
              return;
            }
            const assoc = context.payload.comment.author_association;
            const allowed = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (!allowed.includes(assoc)) {
              core.setFailed(`Commenter association ${assoc} is not allowed to run this command.`);
              return;
            }
            if (!process.env.TARGET_PAT) {
              core.setFailed('Missing TARGET_PAT secret. Add it to repository secrets.');
              return;
            }
            const parts = cmd.split(/\s+/);
            const targetRepo = parts[1] || process.env.DEFAULT_TARGET_REPO;
            if (!targetRepo) {
              core.setFailed('No target repo provided and DEFAULT_TARGET_REPO is not set. Use: /move-to-data owner/repo');
              return;
            }
            const [targetOwner, targetName] = targetRepo.split('/');
            if (!targetOwner || !targetName) {
              core.setFailed('Target repo must be in owner/repo format.');
              return;
            }

            // Raw fetch, not github.request(): octokit's auth hook overwrites any authorization header we pass
            const post = async (path, payload) => {
              const res = await fetch(`https://api.github.com/${path}`, {
                method: 'POST',
                headers: {
                  authorization: `Bearer ${process.env.TARGET_PAT}`,
                  accept: 'application/vnd.github+json',
                  'content-type': 'application/json',
                  'user-agent': 'issue-mover',
                },
                body: JSON.stringify(payload),
              });
              if (!res.ok) throw new Error(`${res.status} on ${path}: ${await res.text()}`);
              return res.json();
            };

            const issueNumber = context.payload.issue.number;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const commentsResp = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const newBody = `Imported from ${issue.html_url}\n\n---\n\n${issue.body || ''}`;
            const labels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name)).filter(Boolean);
            const issuesPath = `repos/${targetOwner}/${targetName}/issues`;

            let createdIssue;
            try {
              createdIssue = await post(issuesPath, { title: issue.title, body: newBody, labels });
            } catch (e) {
              // Target repo may not have these label names and the PAT may not be allowed to create them
              core.warning(`Create with labels failed: ${e.message}. Retrying without labels.`);
              createdIssue = await post(issuesPath, { title: issue.title, body: newBody });
            }
            core.info(`Created issue ${createdIssue.html_url} in ${targetRepo}`);

            for (const c of commentsResp.data) {
              await post(`${issuesPath}/${createdIssue.number}/comments`, {
                body: `From @${c.user.login} on original issue:\n\n${c.body || ''}`,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `This issue was moved to ${createdIssue.html_url} by @${context.actor}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
            });
